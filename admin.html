<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apiary • Панель Управления Ивентами</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #12100e;
      --bg-tile: #1e1914;
      --honey-gold: #f59e0b;
      --honey-yellow: #fbbf24;
      --honey-light: #fef08a;
      --pixel-black: #0c0a09;
      --card-bg: #241d16;
      --card-inner: #1a140f;
      --input-bg: #14100c;
      --text-main: #fef9c3;
      --text-dim: #d4b996;
      --text-muted: #9c8369;
      --accent-green: #4ade80;
      --accent-red: #ef4444;
      --accent-red-hover: #dc2626;
      --accent-blue: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 60%),
        repeating-linear-gradient(45deg, #181410 0, #181410 16px, #14100c 16px, #14100c 32px);
      color: var(--text-main);
      font-family: 'Rubik', sans-serif;
      min-height: 100vh;
      padding: 24px 14px 60px;
    }

    .container { max-width: 940px; margin: 0 auto; }

    .pixel-box {
      background: var(--card-bg);
      border: 4px solid var(--pixel-black);
      box-shadow: 
        inset -4px -4px 0px 0px #18120d,
        inset 4px 4px 0px 0px #3d3023,
        0 6px 0 0 #000;
      padding: 22px;
      margin-bottom: 24px;
    }

    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 10px 14px;
      color: #000;
      background: var(--honey-yellow);
      border: 3px solid #000;
      box-shadow: 
        inset -3px -3px 0px 0px #b45309,
        inset 3px 3px 0px 0px #fef08a,
        0 4px 0 0 #000;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.05s ease, background 0.15s;
      user-select: none;
    }

    .pixel-btn:hover { background: var(--honey-light); }
    .pixel-btn:active {
      transform: translateY(4px);
      box-shadow: inset -3px -3px 0px 0px #b45309, inset 3px 3px 0px 0px #fef08a, 0 0 0 0 #000;
    }

    .pixel-btn.danger {
      background: var(--accent-red);
      color: #fff;
      box-shadow: inset -3px -3px 0px 0px #7f1d1d, inset 3px 3px 0px 0px #fca5a5, 0 4px 0 0 #000;
    }
    .pixel-btn.danger:hover { background: var(--accent-red-hover); }

    .pixel-btn.edit {
      background: #38bdf8;
      color: #000;
      box-shadow: inset -3px -3px 0px 0px #0369a1, inset 3px 3px 0px 0px #bae6fd, 0 4px 0 0 #000;
    }
    .pixel-btn.edit:hover { background: #7dd3fc; }

    .pixel-btn.secondary {
      background: #2a2016;
      color: var(--text-dim);
      box-shadow: inset -3px -3px 0px 0px #17110a, inset 3px 3px 0px 0px #423223, 0 4px 0 0 #000;
    }
    .pixel-btn.secondary:hover { background: #3b2c1d; color: var(--honey-light); }

    header { margin-bottom: 24px; text-align: center; }
    .bee-logo-wrap { display: flex; align-items: center; gap: 14px; justify-content: center; margin-bottom: 10px; }
    .pixel-bee { width: 38px; height: 38px; image-rendering: pixelated; }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: var(--honey-yellow);
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      line-height: 1.4;
    }

    .subtitle { font-size: 13px; color: var(--text-dim); }

    .tabs-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 3px solid #000;
      padding-bottom: 4px;
    }

    .tab-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 10px 16px;
      background: #1b1510;
      color: var(--text-muted);
      border: 3px solid #000;
      border-bottom: none;
      cursor: pointer;
      box-shadow: 0 -2px 0 0 #000;
    }

    .tab-btn.active {
      background: var(--honey-yellow);
      color: #000;
      box-shadow: inset -2px 0 0 #b45309, inset 2px 2px 0 #fef08a, 0 -3px 0 0 #000;
    }

    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--honey-light);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    input, select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 2px solid #000;
      box-shadow: inset 2px 2px 0px 0px #090705, inset -2px -2px 0px 0px #2a2016;
      padding: 11px 13px;
      color: var(--text-main);
      font-family: 'Rubik', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--honey-gold); }
    select { cursor: pointer; }
    select option { background: #1c1611; color: #fff; }
    textarea { resize: vertical; min-height: 85px; line-height: 1.5; }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .status-alert {
      padding: 12px 16px;
      margin-bottom: 20px;
      border: 2px solid #000;
      font-size: 13px;
      display: none;
    }

    .status-alert.success {
      background: rgba(74, 222, 128, 0.15);
      border-color: var(--accent-green);
      color: #86efac;
    }

    .status-alert.error {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--accent-red);
      color: #fca5a5;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 2px dashed #3a2e22;
    }

    .existing-badge {
      display: inline-block;
      font-size: 11px;
      background: #3b2a1a;
      color: var(--honey-gold);
      padding: 4px 8px;
      border: 1px solid var(--honey-gold);
      margin-top: 6px;
    }

    .events-list-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .admin-event-card {
      background: #1c1610;
      border: 3px solid #000;
      box-shadow: 
        inset -2px -2px 0px 0px #120e0a,
        inset 2px 2px 0px 0px #31261b,
        0 4px 0 0 #000;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .admin-event-card.empty-slot {
      opacity: 0.7;
      background: #16110d;
      border-style: dashed;
    }

    .event-meta-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 250px;
    }

    .card-top-tag {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--honey-yellow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-event-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .card-details {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-details span b {
      color: var(--honey-gold);
    }

    .card-description-box {
      font-size: 12.5px;
      color: #ecd7c2;
      background: rgba(0,0,0,0.3);
      padding: 6px 10px;
      border-left: 2px solid var(--honey-gold);
      margin-top: 4px;
      max-width: 600px;
    }

    .card-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      max-width: 420px;
      width: 100%;
    }

    @media (max-width: 640px) {
      .row-2 { grid-template-columns: 1fr; gap: 0; }
      .actions-bar { flex-direction: column; align-items: stretch; }
      .actions-bar button { width: 100%; }
      .card-buttons { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="bee-logo-wrap">
        <svg class="pixel-bee" viewBox="0 0 16 16" fill="none">
          <rect x="3" y="1" width="3" height="3" fill="#BAE6FD"/>
          <rect x="7" y="1" width="3" height="3" fill="#BAE6FD"/>
          <rect x="3" y="6" width="10" height="7" fill="#FBBF24"/>
          <rect x="6" y="6" width="2" height="7" fill="#451A03"/>
          <rect x="10" y="6" width="2" height="7" fill="#451A03"/>
          <rect x="2" y="4" width="1" height="2" fill="#1C1917"/>
          <rect x="4" y="4" width="1" height="2" fill="#1C1917"/>
          <rect x="2" y="8" width="1" height="2" fill="#000"/>
        </svg>
        <h1>МОДЕРАТОРСКАЯ</h1>
      </div>
      <div class="subtitle">Панель управления ивентами • Apiary Network</div>
    </header>

    <div id="status-box" class="status-alert"></div>

    <div class="tabs-bar">
      <button class="tab-btn active" id="tab-btn-list" onclick="switchTab('list')">
        Список ивентов
      </button>
      <button class="tab-btn" id="tab-btn-form" onclick="switchTab('form')">
        Форма / Редактор
      </button>
    </div>

    <!-- Вкладка 1: Список всех дней -->
    <section id="tab-list-view">
      <div class="pixel-box" style="margin-bottom: 16px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <span style="font-size: 13px; color: var(--honey-light); font-weight: 600;">
          Все даты расписания (с возможностью редактирования и очистки)
        </span>
        <button class="pixel-btn secondary" onclick="loadSchedule()" style="font-size: 9px; padding: 6px 10px;">
          ⟳ Обновить список
        </button>
      </div>

      <div id="admin-events-container" class="events-list-wrapper">
        <div class="pixel-box" style="text-align: center; color: var(--text-muted); font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 30px;">
          ЗАГРУЗКА РАСПИСАНИЯ ИЗ УЛЬЯ...
        </div>
      </div>
    </section>

    <!-- Вкладка 2: Форма создания / редактирования -->
    <section id="tab-form-view" style="display: none;">
      <form id="event-form" class="pixel-box" onsubmit="handleFormSubmit(event)">
        <div style="margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
          <h2 style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: var(--honey-yellow);" id="form-heading">
            ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ
          </h2>
          <span id="edit-indicator" style="font-size: 11px; color: var(--accent-blue); display: none;">
            ● Режим редактирования
          </span>
        </div>

        <div class="form-group">
          <label for="date-select">Выберите день:</label>
          <select id="date-select" onchange="handleDateSelectChange()" required>
            <option value="">Загрузка расписания...</option>
          </select>
          <div id="day-notice" class="hint"></div>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label for="organizer-input">Ник ответственного / орга:</label>
            <input type="text" id="organizer-input" placeholder="например, fiwkka" required>
          </div>

          <div class="form-group">
            <label for="time-input">Время проведения (по МСК):</label>
            <input type="text" id="time-input" placeholder="например, 17:00 или 20:00" required>
          </div>
        </div>

        <div class="form-group">
          <label for="title-input">Название ивента:</label>
          <input type="text" id="title-input" placeholder="например, Cats Run или Build Battle" required>
        </div>

        <div class="form-group">
          <label for="desc-input">Подробное описание и правила:</label>
          <textarea id="desc-input" placeholder="Кратко расскажите суть ивента, правила, награды..."></textarea>
        </div>

        <div class="form-group">
          <label for="pin-input">Пин-код доступа модератора:</label>
          <input type="password" id="pin-input" placeholder="••••" autocomplete="current-password" required>
          <div class="hint">Пароль скрыт точками для безопасности</div>
        </div>

        <div class="actions-bar">
          <button type="button" class="pixel-btn danger" onclick="handleClearCurrentForm()" id="btn-delete" style="display: none;">
            🗑 Удалить этот ивент
          </button>
          <div style="flex: 1;"></div>
          <button type="button" class="pixel-btn secondary" onclick="resetFormToBlank()" style="margin-right: 6px;">
            Сбросить
          </button>
          <button type="submit" class="pixel-btn" id="btn-submit">
            Сохранить в улей
          </button>
        </div>
      </form>
    </section>

    <!-- Модалка быстрого удаления из карточки -->
    <div id="delete-modal" class="modal-overlay">
      <div class="pixel-box modal-box">
        <h3 style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--accent-red); margin-bottom: 14px;">
          УДАЛЕНИЕ ИВЕНТА
        </h3>
        <p id="delete-modal-text" style="font-size: 13px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.4;">
          Вы уверены, что хотите удалить ивент?
        </p>
        <div class="form-group">
          <label for="modal-pin-input">Введите пин-код:</label>
          <input type="password" id="modal-pin-input" placeholder="••••" autocomplete="current-password">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px;">
          <button type="button" class="pixel-btn secondary" onclick="closeDeleteModal()">Отмена</button>
          <button type="button" class="pixel-btn danger" id="modal-confirm-delete-btn" onclick="confirmDeleteFromModal()">
            Удалить
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGqxhwqJhWLUWjY-O4ovWUxvp2kNuVQ-jS_NcyuORRT--t-toIYNpXqE58lO1qTmhj/exec';

    let scheduleData = [];
    let pendingDeleteIndex = null;

    function showStatus(msg, type = 'success') {
      const box = document.getElementById('status-box');
      box.textContent = msg;
      box.className = `status-alert ${type}`;
      box.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function hideStatus() {
      document.getElementById('status-box').style.display = 'none';
    }

    function switchTab(tab) {
      hideStatus();
      const isList = tab === 'list';
      document.getElementById('tab-list-view').style.display = isList ? 'block' : 'none';
      document.getElementById('tab-form-view').style.display = isList ? 'none' : 'block';
      document.getElementById('tab-btn-list').classList.toggle('active', isList);
      document.getElementById('tab-btn-form').classList.toggle('active', !isList);
    }

    function normalizeDate(str) {
      if (!str) return '';
      str = str.toString().trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d)) {
          const dd = String(d.getDate()).padStart(2, '0');
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const yyyy = d.getFullYear();
          return `${dd}.${mm}.${yyyy}`;
        }
      }
      return str;
    }

    // Очистка времени и корректное восстановление при наличии дат 1899 года
    function normalizeTime(str) {
      if (!str) return '';
      str = str.toString().trim();
      if (str.includes('T') || str.includes('1899')) {
        const d = new Date(str);
        if (!isNaN(d)) {
          return new Intl.DateTimeFormat('ru-RU', {
            timeZone: 'Asia/Vladivostok',
            hour: '2-digit',
            minute: '2-digit'
          }).format(d);
        }
      }
      if (/^\d{1,2}:\d{2}:\d{2}$/.test(str)) {
        return str.slice(0, 5);
      }
      return str;
    }

    async function loadSchedule() {
      hideStatus();
      const listContainer = document.getElementById('admin-events-container');

      try {
        const res = await fetch(SCRIPT_URL, { redirect: 'follow' });
        if (!res.ok) throw new Error('Ошибка связи: ' + res.status);
        scheduleData = await res.json();

        renderAdminList();
        populateSelectOptions();
      } catch (err) {
        showStatus('Не удалось подключиться к Google Таблице. Проверьте сеть или скрипт.', 'error');
        listContainer.innerHTML = `
          <div class="pixel-box" style="text-align: center; color: var(--accent-red); font-size: 13px;">
            Ошибка загрузки расписания.
          </div>
        `;
        console.error(err);
      }
    }

    function populateSelectOptions() {
      const select = document.getElementById('date-select');
      const currentSelected = select.value;
      select.innerHTML = '<option value="">-- Выберите дату из расписания --</option>';

      scheduleData.forEach((row, idx) => {
        const rawDate = row['Дата'] || row['Число'] || '';
        const cleanDate = normalizeDate(rawDate);
        const weekday = row['День недели'] || '';
        const title = (row['Название ивента'] || row['Название'] || '').toString().trim();
        const host = (row['Ответственный / Организатор'] || row['Ответственный'] || '').toString().trim();

        const hasEvent = Boolean(title || host);
        const statusText = hasEvent ? `[Занято: ${title || host}]` : `[Свободно]`;

        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${cleanDate || '—'} (${weekday}) ${statusText}`;
        select.appendChild(opt);
      });

      if (currentSelected !== "") {
        select.value = currentSelected;
      }
    }

    function renderAdminList() {
      const container = document.getElementById('admin-events-container');
      container.innerHTML = '';

      if (scheduleData.length === 0) {
        container.innerHTML = `
          <div class="pixel-box" style="text-align: center; color: var(--text-muted)">
            Таблица расписания пуста.
          </div>
        `;
        return;
      }

      scheduleData.forEach((item, idx) => {
        const rawDate = item['Дата'] || item['Число'] || '';
        const cleanDate = normalizeDate(rawDate);
        const weekday = item['День недели'] || '';
        const title = (item['Название ивента'] || item['Название'] || '').toString().trim();
        const host = (item['Ответственный / Организатор'] || item['Ответственный'] || '').toString().trim();
        const time = normalizeTime(item['Время по МСК'] || item['Время'] || '');
        const desc = (item['Подробное описание ивента'] || item['Описание'] || '').toString().trim();

        const hasEvent = Boolean(title || host || desc);
        const card = document.createElement('div');
        card.className = `admin-event-card ${!hasEvent ? 'empty-slot' : ''}`;

        card.innerHTML = `
          <div class="event-meta-info">
            <div class="card-top-tag">
              <span>⬡ ${cleanDate || '—'} (${weekday})</span>
              ${hasEvent ? '<span style="color: var(--accent-green);">[АКТИВЕН]</span>' : '<span style="color: var(--text-muted);">[СВОБОДНО]</span>'}
            </div>

            ${hasEvent ? `
              <div class="card-event-name">${title || 'Ивент без названия'}</div>
              <div class="card-details">
                ${host ? `<span>Организатор: <b>${host}</b></span>` : ''}
                ${time ? `<span>Время: <b>${time} МСК</b></span>` : ''}
              </div>
              ${desc ? `<div class="card-description-box">${desc}</div>` : ''}
            ` : `
              <div style="font-size: 13px; color: var(--text-muted); font-style: italic;">
                Слот свободен. Нажмите «Заполнить», чтобы создать ивент.
              </div>
            `}
          </div>

          <div class="card-buttons">
            <button class="pixel-btn edit" onclick="startEditEvent(${idx})">
              ${hasEvent ? '✎ Редактировать' : '+ Заполнить'}
            </button>
            ${hasEvent ? `
              <button class="pixel-btn danger" onclick="openDeleteModal(${idx})">
                🗑 Удалить
              </button>
            ` : ''}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function startEditEvent(idx) {
      switchTab('form');
      const select = document.getElementById('date-select');
      select.value = idx;
      handleDateSelectChange();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleDateSelectChange() {
      hideStatus();
      const select = document.getElementById('date-select');
      const idx = select.value;
      const notice = document.getElementById('day-notice');
      const deleteBtn = document.getElementById('btn-delete');
      const editIndicator = document.getElementById('edit-indicator');

      if (idx === "") {
        resetFormFieldsOnly();
        return;
      }

      const item = scheduleData[idx];
      const title = (item['Название ивента'] || item['Название'] || '').toString().trim();
      const host = (item['Ответственный / Организатор'] || item['Ответственный'] || '').toString().trim();
      const time = normalizeTime(item['Время по МСК'] || item['Время'] || '');
      const desc = (item['Подробное описание ивента'] || item['Описание'] || '').toString().trim();

      document.getElementById('organizer-input').value = host;
      document.getElementById('title-input').value = title;
      document.getElementById('time-input').value = time;
      document.getElementById('desc-input').value = desc;

      if (title || host || desc) {
        notice.innerHTML = '<span class="existing-badge">Редактирование существующего ивента. Вы можете изменить поля или удалить его.</span>';
        deleteBtn.style.display = 'inline-flex';
        editIndicator.style.display = 'inline';
      } else {
        notice.textContent = 'День свободен. Заполните данные для нового ивента.';
        deleteBtn.style.display = 'none';
        editIndicator.style.display = 'none';
      }
    }

    function resetFormFieldsOnly() {
      document.getElementById('organizer-input').value = '';
      document.getElementById('title-input').value = '';
      document.getElementById('time-input').value = '';
      document.getElementById('desc-input').value = '';
      document.getElementById('day-notice').textContent = '';
      document.getElementById('btn-delete').style.display = 'none';
      document.getElementById('edit-indicator').style.display = 'none';
    }

    function resetFormToBlank() {
      document.getElementById('date-select').value = '';
      resetFormFieldsOnly();
    }

    async function sendDataToScript(payload) {
      const submitBtn = document.getElementById('btn-submit');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Отправка...';
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (result.status === 'success') {
          showStatus(result.message || 'Операция успешно выполнена!', 'success');
          await loadSchedule();
          resetFormToBlank();
          document.getElementById('pin-input').value = '';
          return true;
        } else {
          showStatus(result.message || 'Ошибка выполнения.', 'error');
          return false;
        }
      } catch (err) {
        showStatus('Ошибка сети при отправке данных: ' + err.message, 'error');
        console.error(err);
        return false;
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Сохранить в улей';
        }
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const idx = document.getElementById('date-select').value;
      if (idx === '') {
        showStatus('Пожалуйста, выберите дату из списка.', 'error');
        return;
      }

      const item = scheduleData[idx];
      const cleanDate = normalizeDate(item['Дата'] || item['Число'] || '');
      const weekday = item['День недели'] || '';

      const payload = {
        action: 'save',
        rowIndex: item._rowIndex || (Number(idx) + 2),
        date: cleanDate,
        dayOfWeek: weekday,
        organizer: document.getElementById('organizer-input').value.trim(),
        title: document.getElementById('title-input').value.trim(),
        time: document.getElementById('time-input').value.trim(),
        desc: document.getElementById('desc-input').value.trim(),
        pin: document.getElementById('pin-input').value.trim()
      };

      sendDataToScript(payload);
    }

    function handleClearCurrentForm() {
      const idx = document.getElementById('date-select').value;
      if (idx === '') return;

      const pin = document.getElementById('pin-input').value.trim();
      if (!pin) {
        showStatus('Для удаления ивента введите пин-код модератора в форме ниже.', 'error');
        document.getElementById('pin-input').focus();
        return;
      }

      if (!confirm('Вы действительно хотите удалить этот ивент?')) return;

      const item = scheduleData[idx];
      const cleanDate = normalizeDate(item['Дата'] || item['Число'] || '');
      const weekday = item['День недели'] || '';

      const payload = {
        action: 'save',
        rowIndex: item._rowIndex || (Number(idx) + 2),
        date: cleanDate,
        dayOfWeek: weekday,
        organizer: '',
        title: '',
        time: '',
        desc: '',
        pin: pin
      };

      sendDataToScript(payload);
    }

    function openDeleteModal(idx) {
      pendingDeleteIndex = idx;
      const item = scheduleData[idx];
      const rawDate = item['Дата'] || item['Число'] || '';
      const cleanDate = normalizeDate(rawDate);
      const title = item['Название ивента'] || item['Название'] || 'ивент';

      document.getElementById('delete-modal-text').textContent = 
        `Вы действительно хотите удалить ивент «${title}» на ${cleanDate}?`;
      document.getElementById('modal-pin-input').value = '';
      document.getElementById('delete-modal').style.display = 'flex';
      document.getElementById('modal-pin-input').focus();
    }

    function closeDeleteModal() {
      pendingDeleteIndex = null;
      document.getElementById('delete-modal').style.display = 'none';
    }

    async function confirmDeleteFromModal() {
      if (pendingDeleteIndex === null) return;

      const pin = document.getElementById('modal-pin-input').value.trim();
      if (!pin) {
        alert('Введите пин-код!');
        return;
      }

      const item = scheduleData[pendingDeleteIndex];
      const cleanDate = normalizeDate(item['Дата'] || item['Число'] || '');
      const weekday = item['День недели'] || '';

      const payload = {
        action: 'save',
        rowIndex: item._rowIndex || (Number(pendingDeleteIndex) + 2),
        date: cleanDate,
        dayOfWeek: weekday,
        organizer: '',
        title: '',
        time: '',
        desc: '',
        pin: pin
      };

      const btn = document.getElementById('modal-confirm-delete-btn');
      btn.disabled = true;
      btn.textContent = 'Удаление...';

      const success = await sendDataToScript(payload);
      btn.disabled = false;
      btn.textContent = 'Удалить';

      if (success) {
        closeDeleteModal();
      }
    }

    loadSchedule();
  </script>
</body>
</html>
